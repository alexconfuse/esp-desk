## Desk Buddy face MVP — ESP-Mosaico (ESP32-S31)
## Display/touch come from the official BSP (real board drivers).
## Talk / Type / cloud are intentionally out of this scaffold.
dependencies:
  idf:
    version: ">=6.2"

  # Official BSP: CO5300 480×480 QSPI LCD + CST9217 touch + LVGL adapter.
  # Not published as a standalone Component Registry package yet — pin the git tree.
  esp-mosaico-bsp:
    git: https://github.com/esp-mosaico/esp-mosaico-bsp.git
    path: components/esp-mosaico-bsp
    # Pin a known master commit for reproducible fetches (bump intentionally).
    version: 716fc7bca30ed9c61166a0343bf6f5f995b5131f
